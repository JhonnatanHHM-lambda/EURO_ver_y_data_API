services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "0.0.0.0:9000:9000"
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      # Compartido con celery_migracion: api recibe los archivos (POST multipart,
      # views._guardar_archivos_temporales) y el worker los lee para procesarlos.
      - migracion_media_data:/app/media/migracion_masiva_archivo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/admin/login/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M

  celery:
    build: .
    restart: unless-stopped
    env_file: .env
    command: celery -A EURO_ver_y_data worker -l info -Q contratos,default --concurrency=2
    environment:
      SKIP_MIGRATE: "true"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  celery_beat:
    build: .
    restart: unless-stopped
    env_file: .env
    command: celery -A EURO_ver_y_data beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      SKIP_MIGRATE: "true"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # Worker dedicado para migracion_masiva_archivo (OCR + Playwright/SAIA).
  # Concurrency=1 a proposito: execution_control.py es un singleton en memoria de
  # proceso (un solo lote EN_PROCESO a la vez); con --concurrency>1 dos procesos
  # hijos del pool prefork tendrian cada uno su propia copia de ese estado y el
  # cancelar/estado del dashboard dejaria de reflejar la realidad. Ver
  # INFRA_MIGRACION_MASIVA_ARCHIVO.md.
  celery_migracion:
    build:
      context: .
      dockerfile: Dockerfile.celery-migracion
    restart: unless-stopped
    env_file: .env
    command: celery -A EURO_ver_y_data worker -l info -Q migracion_masiva_archivo --concurrency=1
    environment:
      SKIP_MIGRATE: "true"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - migracion_media_data:/app/media/migracion_masiva_archivo
      - migracion_saia_screenshots:/app/saia_screenshots
      # Carpeta de red de origen (montada como CIFS/SMB en el HOST, ver
      # INFRA_MIGRACION_MASIVA_ARCHIVO.md punto 1) — bind mount, no un volumen
      # nombrado de Docker, porque el contenido real vive fuera de Docker.
      - /mnt/gestion-documental:/mnt/gestion-documental
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  minio_data:
  migracion_media_data:
  migracion_saia_screenshots:
